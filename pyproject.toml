[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-memories-for-agents"
version = "0.1.0"
description = "Implementation of shared memories for LLM-based web agents"
requires-python = ">=3.10"
authors = [
    {name = "Yasmine Frizlen"}
]

dependencies = [
    "langgraph~=1.0.9",
    "mistralai>=1.12.3",
    "httpx>=0.27",
    "python-dotenv>=1.0.0",
    "greenlet>=3.1.0",
    "browsergym",
    "playwright>=1.59.0",
    "gymnasium>=1.2.3",
    "huggingface_hub>=0.24.0",
    "pandas>=2.0.0",
    "sentence-transformers>=3.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "bertopic>=0.16",
    "umap-learn>=0.5",
    "hdbscan>=0.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "ipython~=9.10.0",
    "pandas-stubs>=3.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["agent_memories*", "evaluation*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--showlocals",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src/agent_memories", "evaluation"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "**/*.ipynb",
    "scripts/**",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "evaluation", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101"]
"scripts/**" = ["E", "W", "N"]
"notebooks/**" = ["N806", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["agent_memories", "evaluation"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = [
    "^scripts/",
    "^venv/",
]

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "mistralai.*",
    "browsergym.*",
    "playwright.*",
    "gymnasium.*",
    "huggingface_hub.*",
    "IPython.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true
